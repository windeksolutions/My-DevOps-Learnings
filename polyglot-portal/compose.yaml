name: polyglot-portal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  dashboard-service:
    build: ./dashboard-service
    restart: unless-stopped
    networks:
      - frontend-net

  analytics-service:
    build: ./analytics-service
    restart: unless-stopped
    networks:
      - frontend-net

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - dashboard-service
      - analytics-service
    networks:
      - frontend-net

networks:
  frontend-net:
  backend-net:

volumes:
  pg_data:
